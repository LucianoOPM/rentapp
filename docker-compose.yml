# Solo para desarrollo local. La app no se dockeriza; en producción la base es Neon.
name: plataforma-renta

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: rentas
      POSTGRES_PASSWORD: rentas
      POSTGRES_DB: rentas
    ports:
      # Solo accesible desde este equipo.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rentas -d rentas']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
